<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>变动费用分析</title>
  <style>
    :root {
      --blue: #1557a0;
      --blue-soft: #edf4fb;
      --ink: #17212b;
      --muted: #667485;
      --line: #dfe5eb;
      --bg: #f4f6f8;
      --red: #b42318;
      --amber: #9a6700;
      --green: #18794e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--bg); font: 14px/1.55 "Microsoft YaHei", Arial, sans-serif; }
    button, input, select { font: inherit; }
    .hidden { display: none !important; }
    .topbar { height: 58px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
    .brand { display: flex; align-items: baseline; gap: 12px; }
    .brand strong { font-size: 19px; font-weight: 650; letter-spacing: .02em; }
    .brand span, .user { color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; gap: 12px; align-items: center; }
    .link-button, .primary, .secondary { border: 1px solid var(--line); border-radius: 4px; padding: 8px 14px; cursor: pointer; background: #fff; color: var(--ink); }
    .primary { color: #fff; border-color: var(--blue); background: var(--blue); }
    .primary:disabled { opacity: .55; cursor: default; }
    .page { max-width: 1440px; margin: 0 auto; padding: 24px 28px 44px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 18px; }
    h1 { margin: 0 0 4px; font-size: 24px; font-weight: 650; }
    .subtitle, .source-line { color: var(--muted); }
    .period-box { display: flex; align-items: center; gap: 8px; }
    select, input[type="month"], input[type="file"] { min-height: 36px; border: 1px solid #cdd5df; border-radius: 4px; background: #fff; padding: 6px 10px; color: var(--ink); }
    .notice { border-left: 3px solid var(--blue); background: #fff; padding: 10px 14px; margin-bottom: 16px; color: #344054; }
    .notice.warning { border-left-color: var(--amber); background: #fffaf0; }
    .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 18px; }
    .kpi { background: #fff; padding: 16px; min-height: 112px; }
    .kpi-label { color: var(--muted); font-size: 13px; }
    .kpi-value { font-size: 25px; font-variant-numeric: tabular-nums; margin: 7px 0 3px; }
    .kpi-meta { color: var(--muted); font-size: 12px; }
    .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
    .tab { border: 0; border-bottom: 2px solid transparent; color: var(--muted); background: transparent; padding: 10px 2px; cursor: pointer; }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
    .panel { background: #fff; border: 1px solid var(--line); margin-bottom: 16px; }
    .panel-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .panel-head h2 { margin: 0; font-size: 16px; font-weight: 650; }
    .panel-head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .panel-body { padding: 16px; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th { text-align: left; color: #465363; font-weight: 600; background: #f7f8fa; }
    th, td { border-bottom: 1px solid #e8ecf0; padding: 9px 10px; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .rate.over, .negative { color: var(--red); font-weight: 600; }
    .rate.near { color: var(--amber); font-weight: 600; }
    .rate.normal { color: var(--green); }
    .badge { display: inline-block; border-radius: 12px; padding: 2px 8px; font-size: 12px; background: var(--blue-soft); color: var(--blue); }
    .badge.over { color: var(--red); background: #fff0ee; }
    .badge.near { color: var(--amber); background: #fff6df; }
    .bar-row { display: grid; grid-template-columns: 130px 1fr 110px; gap: 12px; align-items: center; margin: 10px 0; }
    .bar-track { height: 9px; background: #edf0f3; }
    .bar { height: 100%; background: var(--blue); }
    .bar-value { text-align: right; font-variant-numeric: tabular-nums; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .toolbar input { width: 240px; }
    .quality-list { display: grid; gap: 8px; }
    .quality-item { border-bottom: 1px solid #edf0f3; padding: 8px 0; display: flex; justify-content: space-between; gap: 20px; }
    .quality-ok { color: var(--green); }
    .quality-bad { color: var(--red); }
    .upload-grid { display: grid; grid-template-columns: 160px minmax(260px, 1fr) auto; gap: 10px; align-items: end; }
    label { display: grid; gap: 5px; color: #475467; font-size: 12px; }
    .empty { padding: 50px 20px; text-align: center; color: var(--muted); }
    .access { max-width: 760px; margin: 80px auto; background: #fff; border: 1px solid var(--line); padding: 28px; }
    @media (max-width: 980px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .page-head { align-items: flex-start; flex-direction: column; }
      .upload-grid { grid-template-columns: 1fr; }
    }
  </style>
  <script src="/js/api-client.js?v=1.0.116"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>变动费用分析</strong><span>独立统计模块</span></div>
    <div class="top-actions"><span class="user" id="currentUser"></span><button class="link-button" id="backBtn">返回经营看板</button></div>
  </header>

  <main class="page hidden" id="pageMain">
    <section class="page-head">
      <div>
        <h1>变动费用统计</h1>
        <div class="source-line" id="sourceLine">尚未导入财务月报</div>
      </div>
      <div class="period-box">
        <label>统计期间<select id="periodSelect"><option value="">最新批次</option></select></label>
        <button class="secondary" id="refreshBtn">刷新</button>
      </div>
    </section>

    <div class="notice">本模块使用独立数据表和导入接口，不更新现有经营看板的业绩、目标、荣誉或方案计算数据。</div>
    <div class="notice warning hidden" id="warningNotice"></div>
    <section class="kpis" id="kpiGrid"></section>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">总览</button>
      <button class="tab" data-tab="organization">模式与机构</button>
      <button class="tab" data-tab="cost">费用构成</button>
      <button class="tab" data-tab="project">项目与产品</button>
      <button class="tab" data-tab="quality">数据校验</button>
    </nav>

    <section id="content"></section>

    <section class="panel hidden" id="uploadPanel">
      <div class="panel-head">
        <div><h2>导入财务月报</h2><p>仅接受截至相应月份、已在 Excel 中完成计算并保存的正式月报。</p></div>
      </div>
      <div class="panel-body">
        <form class="upload-grid" id="uploadForm">
          <label>统计期间<input type="month" id="uploadPeriod" required></label>
          <label>财务月报（.xlsx）<input type="file" id="uploadFile" accept=".xlsx" required></label>
          <button class="primary" id="uploadBtn" type="submit">校验并导入</button>
        </form>
        <div class="source-line" id="uploadStatus" style="margin-top:10px"></div>
      </div>
    </section>
  </main>

  <section class="access hidden" id="accessDenied">
    <h1>无权访问</h1>
    <p>当前账号没有变动费用分析权限，请联系管理员开通。</p>
  </section>
  <script src="/js/variable-expense.js?v=1.0.116"></script>
</body>
</html>

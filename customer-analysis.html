<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户分析</title>
  <style>
    :root {
      --navy:#10213b; --navy-2:#18385f; --blue:#2f80ed; --green:#138a63; --amber:#a56600;
      --red:#c33b32; --ink:#17212b; --muted:#697586; --line:#dfe5eb; --bg:#f3f6f9; --white:#fff;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 "Microsoft YaHei",Arial,sans-serif; }
    button,input,select { font:inherit; }
    .hidden { display:none !important; }
    .topbar { min-height:62px; padding:10px 28px; color:#fff; background:linear-gradient(115deg,var(--navy),var(--navy-2)); display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand strong { font-size:21px; letter-spacing:.03em; }
    .brand span,.user { color:#b9cae0; font-size:12px; margin-left:10px; }
    .top-actions { display:flex; align-items:center; gap:12px; }
    .button { cursor:pointer; border:1px solid #b8c3cf; border-radius:5px; background:#fff; color:var(--ink); padding:8px 14px; }
    .button.primary { color:#fff; background:var(--blue); border-color:var(--blue); }
    .page { max-width:1500px; margin:auto; padding:24px 28px 48px; }
    .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:18px; }
    h1 { margin:0 0 4px; font-size:25px; }
    .subtitle,.meta { color:var(--muted); }
    .filters { display:flex; align-items:flex-end; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
    label { display:grid; gap:4px; color:var(--muted); font-size:12px; }
    input,select { min-height:36px; padding:6px 9px; border:1px solid #c8d1da; border-radius:5px; background:#fff; }
    .notice { margin-bottom:16px; padding:12px 15px; background:#fff; border-left:4px solid var(--blue); }
    .coverage-notice { background:#fff8e8; border-left-color:var(--amber); line-height:1.7; }
    .coverage-notice strong { color:#805600; }
    .coverage-notice .meta { margin-top:4px; font-size:12px; }
    .kpis { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin-bottom:18px; }
    .kpi { min-height:120px; padding:16px; background:#fff; border:1px solid var(--line); border-radius:8px; }
    .kpi-label { color:var(--muted); font-size:12px; }
    .kpi-value { margin:8px 0 4px; font-size:26px; font-weight:650; font-variant-numeric:tabular-nums; }
    .kpi-meta { color:var(--muted); font-size:12px; }
    .up { color:var(--green); } .down { color:var(--red); } .warn { color:var(--amber); }
    .tabs { display:flex; gap:24px; border-bottom:1px solid var(--line); margin-bottom:16px; }
    .tab { border:0; border-bottom:3px solid transparent; padding:11px 2px; color:var(--muted); background:transparent; cursor:pointer; }
    .tab.active { color:var(--blue); border-bottom-color:var(--blue); font-weight:650; }
    .panel { margin-bottom:16px; background:#fff; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
    .panel-head { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:20px; }
    .panel-head h2 { margin:0; font-size:16px; }
    .panel-head p { margin:3px 0 0; color:var(--muted); font-size:12px; }
    .panel-body { padding:16px; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .conclusions { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .conclusion { padding:14px; border:1px solid var(--line); background:#f8fafc; }
    .conclusion b { display:block; margin-bottom:5px; }
    .conclusion p { margin:0; color:#465668; }
    .chart { height:340px; }
    .chart.compact { height:290px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; white-space:nowrap; }
    th,td { padding:9px 10px; border-bottom:1px solid #e8edf2; text-align:left; }
    th { color:#506071; background:#f6f8fa; font-weight:600; }
    td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; }
    .definition { display:grid; gap:8px; }
    .definition div { padding:10px 0; border-bottom:1px solid #edf0f3; }
    .empty,.access { padding:46px 20px; text-align:center; color:var(--muted); }
    .quality-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .quality-item { padding:14px; border:1px solid var(--line); background:#f8fafc; }
    .quality-item strong { display:block; font-size:20px; margin-top:5px; }
    .import-box { display:grid; gap:14px; max-width:920px; }
    .import-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .file-input { width:100%; padding:14px; border:1px dashed #9eabb8; background:#f8fafc; }
    .import-result { padding:14px; border:1px solid var(--line); background:#f8fafc; }
    .import-result.blocked { border-color:#e5b0ac; background:#fff6f5; }
    .import-result.ready { border-color:#9dcfbd; background:#f4fbf8; }
    .message-list { margin:8px 0 0; padding-left:20px; }
    .button:disabled { cursor:not-allowed; opacity:.55; }
    @media (max-width:1100px) {
      .kpis { grid-template-columns:repeat(3,1fr); }
      .grid-2,.conclusions { grid-template-columns:1fr; }
      .quality-grid { grid-template-columns:repeat(2,1fr); }
    }
    @media (max-width:720px) {
      .topbar,.page-head { align-items:flex-start; flex-direction:column; }
      .page { padding:18px 14px 36px; }
      .kpis { grid-template-columns:repeat(2,1fr); }
      .filters { justify-content:flex-start; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="/js/api-client.js?v=1.0.127"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>客户分析</strong><span>获客、复购与保单状态</span></div>
    <div class="top-actions"><span class="user" id="currentUser"></span><button class="button" id="backBtn">返回经营看板</button></div>
  </header>

  <main class="page hidden" id="pageMain">
    <section class="page-head">
      <div>
        <h1>客户经营分析</h1>
        <div class="subtitle" id="sourceLine">正在读取生产数据…</div>
      </div>
      <div class="filters">
        <label>年份<select id="yearInput"><option value="2026">2026</option></select></label>
        <label>统计周期<select id="periodType"><option value="year">年度累计</option><option value="quarter">季度</option><option value="month">月度</option></select></label>
        <label class="hidden" id="periodValueLabel"><span id="periodValueCaption">期间</span><select id="periodValue"></select></label>
        <label>业务<select id="businessLine"><option value="">OTO+证保+蚁桥</option><option>OTO</option><option>证保</option><option>蚁桥</option></select></label>
        <label>机构<select id="orgInput"><option value="">全部机构</option></select></label>
        <label>保单范围<select id="policyScope"><option value="all">全部保单</option><option value="longterm">长险保单</option></select></label>
        <label class="cohort-only hidden">观察窗口<select id="observationWindow"><option value="first_month">首现月</option><option value="twelve_months" selected>首现后12个月</option><option value="calendar_year">首现当年度</option></select></label>
        <label class="cohort-only hidden">产品<select id="productInput"><option value="">全部产品</option></select></label>
        <button class="button primary" id="refreshBtn">应用</button>
      </div>
    </section>

    <div class="notice" id="scopeNotice">新客与老客按所选期间起始日划分；保单状态为客户清单数据截止日的当前状态，不作为13个月或25个月继续率。</div>
    <div class="notice coverage-notice hidden" id="aliasCoverageNotice" role="status" aria-live="polite">
      <strong>客户关联覆盖提示</strong>
      <div id="aliasCoverageMessage"></div>
      <div class="meta" id="aliasCoverageScope"></div>
    </div>
    <section class="kpis" id="kpiGrid"></section>
    <nav class="tabs" id="tabs" role="tablist" aria-label="客户分析页签">
      <button class="tab active" data-tab="overview" role="tab" aria-selected="true">经营概览</button>
      <button class="tab" data-tab="customer" role="tab" aria-selected="false">新老客户</button>
      <button class="tab" data-tab="cohort" role="tab" aria-selected="false">新客经营</button>
      <button class="tab" data-tab="holding" role="tab" aria-selected="false">持单与间隔</button>
      <button class="tab" data-tab="policy" role="tab" aria-selected="false">保单状态</button>
      <button class="tab" data-tab="quality" role="tab" aria-selected="false">口径与质量</button>
      <button class="tab" data-tab="import" role="tab" aria-selected="false">数据导入</button>
    </nav>
    <section id="content"></section>
  </main>
  <section class="access hidden" id="accessDenied">当前账号没有“客户分析”权限，请联系管理员。</section>
  <script src="/js/customer-analysis.js?v=1.0.146-f5ce7460e94b"></script>
</body>
</html>

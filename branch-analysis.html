<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>证保网点分析</title>
  <style>
    :root {
      --navy:#10213b; --navy-2:#18385f; --blue:#2f80ed; --cyan:#20b9d4;
      --ink:#17212b; --muted:#697586; --line:#dfe5eb; --bg:#f3f6f9;
      --white:#fff; --green:#138a63; --amber:#a56600; --red:#c33b32;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 "Microsoft YaHei",Arial,sans-serif; }
    button,input,select { font:inherit; }
    .hidden { display:none !important; }
    .topbar { min-height:62px; padding:10px 28px; color:#fff; background:linear-gradient(115deg,var(--navy),var(--navy-2)); display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand strong { font-size:21px; letter-spacing:.03em; }
    .brand span,.user { color:#b9cae0; font-size:12px; margin-left:10px; }
    .top-actions { display:flex; align-items:center; gap:12px; }
    .button { cursor:pointer; border:1px solid #b8c3cf; border-radius:5px; background:#fff; color:var(--ink); padding:8px 14px; }
    .button.primary { color:#fff; background:var(--blue); border-color:var(--blue); }
    .page { max-width:1500px; margin:auto; padding:24px 28px 48px; }
    .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:18px; }
    h1 { margin:0 0 4px; font-size:25px; }
    .subtitle,.meta { color:var(--muted); }
    .filters { display:flex; align-items:flex-end; gap:8px; }
    label { display:grid; gap:4px; color:var(--muted); font-size:12px; }
    input,select { min-height:36px; padding:6px 9px; border:1px solid #c8d1da; border-radius:5px; background:#fff; }
    .notice { margin-bottom:16px; padding:12px 15px; background:#fff; border-left:4px solid var(--blue); }
    .kpis { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin-bottom:18px; }
    .kpi { min-height:120px; padding:16px; background:#fff; border:1px solid var(--line); border-radius:8px; }
    .kpi-label { color:var(--muted); font-size:12px; }
    .kpi-value { margin:8px 0 4px; font-size:26px; font-weight:650; font-variant-numeric:tabular-nums; }
    .kpi-meta { color:var(--muted); font-size:12px; }
    .up { color:var(--green); } .down { color:var(--red); } .warn { color:var(--amber); }
    .tabs { display:flex; gap:24px; border-bottom:1px solid var(--line); margin-bottom:16px; }
    .tab { border:0; border-bottom:3px solid transparent; padding:11px 2px; color:var(--muted); background:transparent; cursor:pointer; }
    .tab.active { color:var(--blue); border-bottom-color:var(--blue); font-weight:650; }
    .panel { margin-bottom:16px; background:#fff; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
    .panel-head { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:20px; }
    .panel-head h2 { margin:0; font-size:16px; }
    .panel-head p { margin:3px 0 0; color:var(--muted); font-size:12px; }
    .panel-body { padding:16px; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .callouts { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .callout { padding:14px; border:1px solid var(--line); background:#f8fafc; }
    .callout b { display:block; margin-bottom:5px; }
    .callout p { margin:0; color:var(--muted); }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .toolbar input { min-width:300px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; white-space:nowrap; }
    th,td { padding:9px 10px; border-bottom:1px solid #e8edf2; text-align:left; }
    th { color:#506071; background:#f6f8fa; font-weight:600; }
    td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; }
    .badge { display:inline-block; border-radius:12px; padding:2px 8px; font-size:12px; background:#eaf2fd; color:#2664ae; }
    .badge.live { color:var(--green); background:#eaf8f2; }
    .badge.new { color:#2664ae; background:#eaf2fd; }
    .badge.lost { color:var(--amber); background:#fff5df; }
    .badge.off { color:var(--muted); background:#edf0f3; }
    .empty,.access { padding:46px 20px; text-align:center; color:var(--muted); }
    .definition { display:grid; gap:8px; }
    .definition div { padding:10px 0; border-bottom:1px solid #edf0f3; }
    @media (max-width:1100px) {
      .kpis { grid-template-columns:repeat(3,1fr); }
      .grid-2,.callouts { grid-template-columns:1fr; }
    }
    @media (max-width:720px) {
      .topbar,.page-head { align-items:flex-start; flex-direction:column; }
      .page { padding:18px 14px 36px; }
      .kpis { grid-template-columns:repeat(2,1fr); }
      .filters { flex-wrap:wrap; }
    }
  </style>
  <script src="/js/api-client.js?v=1.0.137"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>证保网点分析</strong><span>网点主数据与经营表现</span></div>
    <div class="top-actions"><span class="user" id="currentUser"></span><button class="button" id="backBtn">返回经营看板</button></div>
  </header>

  <main class="page hidden" id="pageMain">
    <section class="page-head">
      <div>
        <h1>网点经营驾驶舱</h1>
        <div class="subtitle" id="sourceLine">正在读取生产数据…</div>
      </div>
      <div class="filters">
        <label>年份<input id="yearInput" type="number" min="2020" max="2100" value="2026"></label>
        <label>统计周期
          <select id="periodType">
            <option value="year">年度累计</option>
            <option value="quarter">季度</option>
            <option value="month">月度</option>
          </select>
        </label>
        <label class="hidden" id="periodValueLabel"><span id="periodValueCaption">期间</span><select id="periodValue"></select></label>
        <label>统计截止<input id="asOfInput" type="date"></label>
        <button class="button primary" id="refreshBtn">应用</button>
      </div>
    </section>

    <div class="notice">常规网点147个纳入网点数和活动率统计；归属于广发证券股份有限公司的86个转介绍网点单列展示，常规统计不纳入其网点数。</div>
    <section class="kpis" id="kpiGrid"></section>

    <nav class="tabs" id="tabs" role="tablist" aria-label="网点分析页签">
      <button class="tab active" data-tab="overview" role="tab" aria-selected="true">经营概览</button>
      <button class="tab" data-tab="regular" role="tab" aria-selected="false">常规网点</button>
      <button class="tab" data-tab="referral" role="tab" aria-selected="false">转介绍名录</button>
      <button class="tab" data-tab="quality" role="tab" aria-selected="false">口径与质量</button>
    </nav>
    <section id="content"></section>
  </main>

  <section class="access hidden" id="accessDenied">当前账号没有“证保网点分析”权限，请联系管理员。</section>
  <script src="/js/branch-analysis.js?v=1.0.137"></script>
</body>
</html>
